server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Todas las rutas del cliente (React Router) caen en index.html;
    # sin esto, refrescar /ventas o /productos daría 404 en Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
